<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expense Tracker — Smart Filter</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#F5F7FE;
  font-family:system-ui,-apple-system,'Segoe UI','Inter',sans-serif;
  color:#1A2C3E;
  padding-bottom:100px;
}

.app-container{
  max-width:500px;
  margin:auto;
  padding:20px 18px 40px;
}

/* HEADER */

.logo-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.logo{
  font-size:30px;
  font-weight:800;
  background:linear-gradient(135deg,#1E3A6F,#2563EB);
  -webkit-background-clip:text;
  color:transparent;
}

.badge{
  background:#EAF1FF;
  color:#2563EB;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

/* DASHBOARD */

.dashboard-sticky{
  position:sticky;
  top:10px;
  z-index:10;
  margin-bottom:24px;
}

.stats-grid{
  display:flex;
  gap:12px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);
  border-radius:34px;
  padding:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.06);
}

.stat-card{
  flex:1;
  background:white;
  border-radius:24px;
  padding:14px 8px;
  text-align:center;
}

.stat-label{
  font-size:12px;
  font-weight:700;
  color:#6B7280;
  margin-bottom:8px;
  text-transform:uppercase;
}

.stat-number{
  font-size:22px;
  font-weight:800;
}

.credit-num{color:#059669;}
.debit-num{color:#DC2626;}
.balance-num{color:#2563EB;}

/* FORM */

.add-transaction-card{
  background:white;
  border-radius:38px;
  padding:22px;
  margin-bottom:28px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:20px;
  color:#1E3A6F;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
  color:#475569;
}

input,
select{
  width:100%;
  border:none;
  background:#F8FAFC;
  border:1.5px solid #E2E8F0;
  border-radius:24px;
  padding:16px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus{
  border-color:#3B82F6;
  background:white;
}

.add-btn{
  width:100%;
  border:none;
  background:linear-gradient(135deg,#2563EB,#1D4ED8);
  color:white;
  padding:16px;
  border-radius:999px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.add-btn:active{
  transform:scale(.98);
}

/* SEARCH + FILTER BAR */

.search-box{
  margin-bottom:18px;
}

.search-box input{
  background:white;
}

/* FILTER ROW — NEW (preserves design) */
.filter-row {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.filter-btn {
  flex: 1;
  text-align: center;
  background: #F1F5F9;
  border: none;
  border-radius: 999px;
  padding: 12px 8px;
  font-size: 15px;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  backdrop-filter: blur(2px);
  letter-spacing: 0.3px;
}

.filter-btn:active {
  transform: scale(0.97);
}

/* active state: blue gradient + white text */
.filter-btn.active-filter {
  background: linear-gradient(135deg, #2563EB, #1D4ED8);
  color: white;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
}

/* HISTORY */

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.history-count{
  background:#EAF1FF;
  color:#2563EB;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.transactions-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.transaction-card{
  background:white;
  border-radius:28px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 16px rgba(0,0,0,.05);
  animation:fade .25s ease;
}

.tx-left{
  flex:1;
}

.tx-type{
  font-size:13px;
  font-weight:800;
  margin-bottom:4px;
}

.credit{
  color:#059669;
}

.debit{
  color:#DC2626;
}

.tx-desc{
  font-size:15px;
  font-weight:600;
  margin-bottom:6px;
}

.tx-date{
  font-size:12px;
  color:#64748B;
}

.tx-amount{
  font-size:18px;
  font-weight:800;
  margin-right:10px;
}

.amount-credit{
  color:#059669;
}

.amount-debit{
  color:#DC2626;
}

.delete-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#FEE2E2;
  color:#DC2626;
  font-size:18px;
  cursor:pointer;
}

.empty-state{
  background:white;
  padding:50px 20px;
  text-align:center;
  border-radius:32px;
  color:#64748B;
  font-weight:600;
}

/* FLOATING BUTTON */

.floating-add-area{
  position:fixed;
  bottom:22px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:50;
}

.floating-btn{
  background:white;
  border:none;
  padding:14px 26px;
  border-radius:999px;
  font-size:17px;
  font-weight:700;
  color:#2563EB;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.floating-btn span{
  font-size:24px;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(min-width:768px){
  .app-container{
    max-width:720px;
  }
  .filter-btn {
    padding: 14px 8px;
    font-size: 16px;
  }
}
</style>
</head>
<body>

<div class="app-container">

  <div class="logo-area">
    <div class="logo">Expense Tracker</div>
    <div class="badge">Track expense digitally</div>
  </div>

  <div class="dashboard-sticky">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Credit</div>
        <div class="stat-number credit-num" id="totalCredit">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Debit</div>
        <div class="stat-number debit-num" id="totalDebit">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Balance</div>
        <div class="stat-number balance-num" id="balance">₹0</div>
      </div>
    </div>
  </div>

  <div class="add-transaction-card" id="addCard">
    <div class="section-title">➕ New transaction</div>
    <div class="input-group">
      <label>Type</label>
      <select id="txnType">
        <option value="credit">Credit</option>
        <option value="debit">Debit</option>
      </select>
    </div>
    <div class="input-group">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>
    <div class="input-group">
      <label>Reason</label>
      <input type="text" id="description" placeholder="Enter reason">
    </div>
    <div class="input-group">
      <label>Date</label>
      <input type="date" id="datePicker">
    </div>
    <button class="add-btn" id="addTransactionBtn">
      Add Transaction
    </button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by reason or date">
  </div>

  <!-- NEW FILTER BUTTONS: All / Credit / Debit (preserve UI) -->
  <div class="filter-row" id="filterRow">
    <button class="filter-btn active-filter" data-filter="all">All</button>
    <button class="filter-btn" data-filter="credit">Credit</button>
    <button class="filter-btn" data-filter="debit">Debit</button>
  </div>

  <div class="history-header">
    <div class="section-title" style="margin:0;">📋 History</div>
    <div class="history-count" id="txCount">0 items</div>
  </div>

  <div class="transactions-list" id="transactionsContainer">
    <div class="empty-state">
      No transactions yet
    </div>
  </div>

</div>

<div class="floating-add-area">
  <button class="floating-btn" id="scrollToAddBtn">
    <span>+</span> Add
  </button>
</div>

<script>
  (function() {
    // ---------- STORAGE ----------
    const STORAGE_KEY = "finora_transactions";
    let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // ---------- DOM elements ----------
    const totalCreditEl = document.getElementById("totalCredit");
    const totalDebitEl = document.getElementById("totalDebit");
    const balanceEl = document.getElementById("balance");
    const txnType = document.getElementById("txnType");
    const amountInput = document.getElementById("amount");
    const descriptionInput = document.getElementById("description");
    const datePicker = document.getElementById("datePicker");
    const addBtn = document.getElementById("addTransactionBtn");
    const transactionsContainer = document.getElementById("transactionsContainer");
    const txCountSpan = document.getElementById("txCount");
    const searchInput = document.getElementById("searchInput");
    const scrollBtn = document.getElementById("scrollToAddBtn");

    // ---------- Filter state & elements ----------
    let currentFilter = "all";   // "all", "credit", "debit"
    const filterBtns = document.querySelectorAll(".filter-btn");

    // Helper: update active styling
    function setActiveFilterButton(filterValue) {
      filterBtns.forEach(btn => {
        const btnFilter = btn.getAttribute("data-filter");
        if (btnFilter === filterValue) {
          btn.classList.add("active-filter");
        } else {
          btn.classList.remove("active-filter");
        }
      });
    }

    // attach filter click handlers
    function initFilterButtons() {
      filterBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
          const filterValue = btn.getAttribute("data-filter");
          if (filterValue === "all") currentFilter = "all";
          else if (filterValue === "credit") currentFilter = "credit";
          else if (filterValue === "debit") currentFilter = "debit";
          setActiveFilterButton(currentFilter);
          renderTransactions();      // re-render with filter + search + sorting
        });
      });
    }

    // ---------- HELPER: default date ----------
    function setDefaultDate() {
      if (!datePicker.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        datePicker.value = `${yyyy}-${mm}-${dd}`;
      }
    }

    // ---------- Format money ----------
    function formatMoney(value) {
      return `₹${Number(value).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    // ---------- Save to localStorage ----------
    function saveTransactions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    // ---------- Update totals (credit/debit/balance) - always based on all transactions ----------
    function updateTotals() {
      let credit = 0;
      let debit = 0;
      transactions.forEach(tx => {
        if (tx.type === "credit") {
          credit += Number(tx.amount);
        } else {
          debit += Number(tx.amount);
        }
      });
      totalCreditEl.innerText = formatMoney(credit);
      totalDebitEl.innerText = formatMoney(debit);
      balanceEl.innerText = formatMoney(credit - debit);
      txCountSpan.innerText = `${transactions.length} ${transactions.length === 1 ? "item" : "items"}`;
    }

    // ---------- DELETE transaction ----------
    function deleteTransaction(id) {
      transactions = transactions.filter(tx => tx.id !== id);
      saveTransactions();
      renderTransactions();   // will reapply filter + search + sorting and update totals
    }

    // ---------- CORE RENDER: applies search, filter (credit/debit/all), date sorting (oldest first as original) ----------
    function renderTransactions() {
      updateTotals();  // totals always from raw transactions

      // 1) get search value
      const searchValue = searchInput.value.toLowerCase().trim();

      // 2) start with all transactions
      let filtered = [...transactions];

      // 3) APPLY TYPE FILTER (credit / debit / all) 
      if (currentFilter === "credit") {
        filtered = filtered.filter(tx => tx.type === "credit");
      } else if (currentFilter === "debit") {
        filtered = filtered.filter(tx => tx.type === "debit");
      }
      // "all" leaves filtered unchanged

      // 4) APPLY SEARCH filter (by reason or date)
      if (searchValue) {
        filtered = filtered.filter(tx => {
          const desc = tx.description.toLowerCase();
          const rawDate = tx.date.toLowerCase();
          const formattedDate = rawDate.split("-").reverse().join("/");
          return (
            desc.includes(searchValue) ||
            rawDate.includes(searchValue) ||
            formattedDate.includes(searchValue)
          );
        });
      }

      // 5) SORTING: oldest first (same as original logic) — using date then createdAt
      filtered.sort((a, b) => {
        const [yearA, monthA, dayA] = a.date.split("-").map(Number);
        const [yearB, monthB, dayB] = b.date.split("-").map(Number);
        const timeA = new Date(yearA, monthA - 1, dayA).getTime();
        const timeB = new Date(yearB, monthB - 1, dayB).getTime();
        if (timeA !== timeB) return timeA - timeB;
        // if same date, older insertion first (createdAt)
        return (a.createdAt || 0) - (b.createdAt || 0);
      });

      // 6) render HTML
      if (filtered.length === 0) {
        let emptyMessage = "No matching transactions";
        if (transactions.length === 0) emptyMessage = "No transactions yet";
        else if (currentFilter !== "all" && searchValue) emptyMessage = `No ${currentFilter} transactions match "${searchValue}"`;
        else if (currentFilter !== "all") emptyMessage = `No ${currentFilter} transactions found`;
        else if (searchValue) emptyMessage = `No results for "${searchValue}"`;
        transactionsContainer.innerHTML = `<div class="empty-state">✨ ${emptyMessage}</div>`;
        return;
      }

      transactionsContainer.innerHTML = "";
      filtered.forEach(tx => {
        const displayDate = tx.date.split("-").reverse().join("/");
        const card = document.createElement("div");
        card.className = "transaction-card";
        card.innerHTML = `
          <div class="tx-left">
            <div class="tx-type ${tx.type}">
              ${tx.type.toUpperCase()}
            </div>
            <div class="tx-desc">
              ${escapeHtml(tx.description)}
            </div>
            <div class="tx-date">
              📅 ${escapeHtml(displayDate)}
            </div>
          </div>
          <div class="tx-amount ${tx.type === "credit" ? "amount-credit" : "amount-debit"}">
            ${tx.type === "credit" ? "+" : "-"} ${formatMoney(tx.amount)}
          </div>
          <button class="delete-btn" data-id="${tx.id}">
            ✕
          </button>
        `;
        transactionsContainer.appendChild(card);
      });

      // attach delete events to new delete buttons
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-id");
          if (id) deleteTransaction(id);
        });
      });
    }

    // simple escape for safety
    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
      });
    }

    // ---------- ADD transaction ----------
    function addTransactionHandler() {
      const type = txnType.value;
      const amt = parseFloat(amountInput.value);
      const desc = descriptionInput.value.trim();
      const date = datePicker.value;

      if (!amt || amt <= 0) {
        alert("Enter valid amount");
        amountInput.focus();
        return;
      }
      if (!desc) {
        alert("Enter reason");
        descriptionInput.focus();
        return;
      }
      if (!date) {
        alert("Select date");
        datePicker.focus();
        return;
      }

      const newTx = {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36),
        type: type,
        amount: amt,
        description: desc,
        date: date,
        createdAt: Date.now()
      };
      transactions.push(newTx);
      saveTransactions();

      // reset form fields (keep type but reset amount & desc)
      amountInput.value = "";
      descriptionInput.value = "";
      setDefaultDate();

      // re-render with same filter/search state
      renderTransactions();

      // optional: smooth little feedback scroll to history
      const historyHeader = document.querySelector(".history-header");
      if (historyHeader) historyHeader.scrollIntoView({ behavior: "smooth", block: "start" });
      amountInput.focus();
    }

    // ---------- SEARCH event ----------
    function onSearchInput() {
      renderTransactions();   // search + filter + sort
    }

    // ---------- floating button scroll ----------
    function scrollToAddCard() {
      const addCard = document.getElementById("addCard");
      if (addCard) {
        addCard.scrollIntoView({ behavior: "smooth", block: "center" });
        amountInput.focus();
      }
    }

    // ---------- RESET DEFAULT DATE (initial) ----------
    setDefaultDate();

    // ---------- EVENT LISTENERS ----------
    addBtn.addEventListener("click", addTransactionHandler);
    searchInput.addEventListener("input", onSearchInput);
    scrollBtn.addEventListener("click", scrollToAddCard);

    // optional: keypress on amount/description to quickly add (Enter)
    amountInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addTransactionHandler();
      }
    });
    descriptionInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addTransactionHandler();
      }
    });

    // ensure amount doesn't have leading zeros issues
    amountInput.addEventListener("input", function(e) {
      if (this.value.startsWith("0") && this.value.length > 1 && !this.value.startsWith("0.")) {
        this.value = this.value.replace(/^0+/, "");
      }
    });

    // init filter buttons and active style
    initFilterButtons();
    // ensure 'All' is active on load (if not default)
    setActiveFilterButton("all");
    currentFilter = "all";

    // load transactions and initial render
    renderTransactions();

    // if localStorage updates from another tab, sync gracefully
    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        const newData = localStorage.getItem(STORAGE_KEY);
        if (newData) {
          try {
            transactions = JSON.parse(newData) || [];
          } catch(err) { transactions = []; }
          renderTransactions();
        }
      }
    });
  })();
</script>
</body>
</html>
