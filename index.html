<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expense Tracker</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#F5F7FE;
  font-family:system-ui,-apple-system,'Segoe UI','Inter',sans-serif;
  color:#1A2C3E;
  padding-bottom:100px;
}

.app-container{
  max-width:500px;
  margin:auto;
  padding:20px 18px 40px;
}

/* HEADER */

.logo-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.logo{
  font-size:30px;
  font-weight:800;
  background:linear-gradient(135deg,#1E3A6F,#2563EB);
  -webkit-background-clip:text;
  color:transparent;
}

.badge{
  background:#EAF1FF;
  color:#2563EB;
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

/* DASHBOARD */

.dashboard-sticky{
  position:sticky;
  top:10px;
  z-index:10;
  margin-bottom:24px;
}

.stats-grid{
  display:flex;
  gap:12px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);
  border-radius:34px;
  padding:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.06);
}

.stat-card{
  flex:1;
  background:white;
  border-radius:24px;
  padding:14px 8px;
  text-align:center;
}

.stat-label{
  font-size:12px;
  font-weight:700;
  color:#6B7280;
  margin-bottom:8px;
  text-transform:uppercase;
}

.stat-number{
  font-size:22px;
  font-weight:800;
}

.credit-num{color:#059669;}
.debit-num{color:#DC2626;}
.balance-num{color:#2563EB;}

/* FORM */

.add-transaction-card{
  background:white;
  border-radius:38px;
  padding:22px;
  margin-bottom:28px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:20px;
  color:#1E3A6F;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
  color:#475569;
}

input,
select{
  width:100%;
  border:none;
  background:#F8FAFC;
  border:1.5px solid #E2E8F0;
  border-radius:24px;
  padding:16px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus{
  border-color:#3B82F6;
  background:white;
}

.add-btn{
  width:100%;
  border:none;
  background:linear-gradient(135deg,#2563EB,#1D4ED8);
  color:white;
  padding:16px;
  border-radius:999px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.add-btn:active{
  transform:scale(.98);
}

/* SEARCH */

.search-box{
  margin-bottom:18px;
}

.search-box input{
  background:white;
}

/* HISTORY */

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.history-count{
  background:#EAF1FF;
  color:#2563EB;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.transactions-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.transaction-card{
  background:white;
  border-radius:28px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 16px rgba(0,0,0,.05);
  animation:fade .25s ease;
}

.tx-left{
  flex:1;
}

.tx-type{
  font-size:13px;
  font-weight:800;
  margin-bottom:4px;
}

.credit{
  color:#059669;
}

.debit{
  color:#DC2626;
}

.tx-desc{
  font-size:15px;
  font-weight:600;
  margin-bottom:6px;
}

.tx-date{
  font-size:12px;
  color:#64748B;
}

.tx-amount{
  font-size:18px;
  font-weight:800;
  margin-right:10px;
}

.amount-credit{
  color:#059669;
}

.amount-debit{
  color:#DC2626;
}

.delete-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#FEE2E2;
  color:#DC2626;
  font-size:18px;
  cursor:pointer;
}

.empty-state{
  background:white;
  padding:50px 20px;
  text-align:center;
  border-radius:32px;
  color:#64748B;
  font-weight:600;
}

/* FLOATING BUTTON */

.floating-add-area{
  position:fixed;
  bottom:22px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:50;
}

.floating-btn{
  background:white;
  border:none;
  padding:14px 26px;
  border-radius:999px;
  font-size:17px;
  font-weight:700;
  color:#2563EB;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.floating-btn span{
  font-size:24px;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(min-width:768px){
  .app-container{
    max-width:720px;
  }
}
</style>
</head>

<body>

<div class="app-container">

  <div class="logo-area">
    <div class="logo">Expense Tracker</div>
    <div class="badge">Track expense digitally</div>
  </div>

  <div class="dashboard-sticky">
    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-label">Credit</div>
        <div class="stat-number credit-num" id="totalCredit">₹0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Debit</div>
        <div class="stat-number debit-num" id="totalDebit">₹0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Balance</div>
        <div class="stat-number balance-num" id="balance">₹0</div>
      </div>

    </div>
  </div>

  <div class="add-transaction-card" id="addCard">

    <div class="section-title">➕ New transaction</div>

    <div class="input-group">
      <label>Type</label>

      <select id="txnType">
        <option value="credit">Credit</option>
        <option value="debit">Debit</option>
      </select>
    </div>

    <div class="input-group">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <div class="input-group">
      <label>Reason</label>
      <input type="text" id="description" placeholder="Enter reason">
    </div>

    <div class="input-group">
      <label>Date</label>
      <input type="date" id="datePicker">
    </div>

    <button class="add-btn" id="addTransactionBtn">
      Add Transaction
    </button>

  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by reason or date">
  </div>

  <div class="history-header">
    <div class="section-title" style="margin:0;">📋 History</div>
    <div class="history-count" id="txCount">0 items</div>
  </div>

  <div class="transactions-list" id="transactionsContainer">
    <div class="empty-state">
      No transactions yet
    </div>
  </div>

</div>

<div class="floating-add-area">
  <button class="floating-btn" id="scrollToAddBtn">
    <span>+</span> Add
  </button>
</div>

<script>

const STORAGE_KEY = "finora_transactions";

let transactions =
JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

/* DOM */

const totalCreditEl = document.getElementById("totalCredit");
const totalDebitEl = document.getElementById("totalDebit");
const balanceEl = document.getElementById("balance");

const txnType = document.getElementById("txnType");
const amount = document.getElementById("amount");
const description = document.getElementById("description");
const datePicker = document.getElementById("datePicker");

const addBtn = document.getElementById("addTransactionBtn");

const txContainer = document.getElementById("transactionsContainer");

const txCount = document.getElementById("txCount");

const searchInput = document.getElementById("searchInput");

const scrollBtn = document.getElementById("scrollToAddBtn");

/* DEFAULT DATE */

(function(){

  const today = new Date();

  const yyyy = today.getFullYear();

  const mm = String(today.getMonth()+1)
  .padStart(2,"0");

  const dd = String(today.getDate())
  .padStart(2,"0");

  datePicker.value = `${yyyy}-${mm}-${dd}`;

})();

/* MONEY FORMAT */

function formatMoney(value){

  return `₹${Number(value).toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })}`;

}

/* SAVE */

function saveTransactions(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(transactions)
  );

}

/* TOTALS */

function updateTotals(){

  let credit = 0;
  let debit = 0;

  transactions.forEach(tx=>{

    if(tx.type === "credit"){
      credit += Number(tx.amount);
    }else{
      debit += Number(tx.amount);
    }

  });

  totalCreditEl.innerText = formatMoney(credit);
  totalDebitEl.innerText = formatMoney(debit);
  balanceEl.innerText = formatMoney(credit - debit);

  txCount.innerText =
  `${transactions.length} ${
    transactions.length === 1 ? "item" : "items"
  }`;

}

/* DELETE */

function deleteTransaction(id){

  transactions = transactions.filter(
    tx => tx.id !== id
  );

  saveTransactions();

  renderTransactions();

}

/* RENDER */

function renderTransactions(){

  updateTotals();

  const searchValue =
  searchInput.value.toLowerCase().trim();

  let filtered = [...transactions];

  /* SEARCH */

  if(searchValue){

    filtered = filtered.filter(tx=>{

      const desc =
      tx.description.toLowerCase();

      const rawDate =
      tx.date.toLowerCase();

      const formattedDate =
      rawDate.split("-").reverse().join("/");

      return (
        desc.includes(searchValue) ||
        rawDate.includes(searchValue) ||
        formattedDate.includes(searchValue)
      );

    });

  }

  /* EARLIEST DATE FIRST */

  filtered.sort((a,b)=>{

    const [yearA, monthA, dayA] =
    a.date.split("-").map(Number);

    const [yearB, monthB, dayB] =
    b.date.split("-").map(Number);

    const timeA =
    new Date(yearA, monthA - 1, dayA).getTime();

    const timeB =
    new Date(yearB, monthB - 1, dayB).getTime();

    /* oldest first */

    if(timeA !== timeB){
      return timeA - timeB;
    }

    /* older inserted first */

    return a.createdAt - b.createdAt;

  });

  if(filtered.length === 0){

    txContainer.innerHTML = `
      <div class="empty-state">
        No matching transactions
      </div>
    `;

    return;
  }

  txContainer.innerHTML = "";

  filtered.forEach(tx=>{

    const displayDate =
    tx.date.split("-").reverse().join("/");

    const card =
    document.createElement("div");

    card.className = "transaction-card";

    card.innerHTML = `

      <div class="tx-left">

        <div class="tx-type ${tx.type}">
          ${tx.type.toUpperCase()}
        </div>

        <div class="tx-desc">
          ${tx.description}
        </div>

        <div class="tx-date">
          📅 ${displayDate}
        </div>

      </div>

      <div class="tx-amount ${
        tx.type === "credit"
        ? "amount-credit"
        : "amount-debit"
      }">

        ${tx.type === "credit" ? "+" : "-"}

        ${formatMoney(tx.amount)}

      </div>

      <button
        class="delete-btn"
        onclick="deleteTransaction('${tx.id}')"
      >
        ✕
      </button>

    `;

    txContainer.appendChild(card);

  });

}

/* ADD */

addBtn.addEventListener("click", ()=>{

  const type = txnType.value;

  const amt =
  parseFloat(amount.value);

  const desc =
  description.value.trim();

  const date =
  datePicker.value;

  if(!amt || amt <= 0){

    alert("Enter valid amount");

    return;
  }

  if(!desc){

    alert("Enter reason");

    return;
  }

  if(!date){

    alert("Select date");

    return;
  }

  const tx = {

    id: crypto.randomUUID(),

    type:type,

    amount:amt,

    description:desc,

    date:date,

    createdAt:Date.now()

  };

  transactions.push(tx);

  saveTransactions();

  amount.value = "";
  description.value = "";

  renderTransactions();

});

/* SEARCH */

searchInput.addEventListener(
  "input",
  renderTransactions
);

/* FLOAT BUTTON */

scrollBtn.addEventListener("click", ()=>{

  document
  .getElementById("addCard")
  .scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  amount.focus();

});

/* FIRST LOAD */

renderTransactions();

</script>

</body>
</html>
